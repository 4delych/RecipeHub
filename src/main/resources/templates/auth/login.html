<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{auth.login.title}">Вход</title>
</head>
<body>
<h1 th:text="#{auth.login.title}">Вход</h1>

<p th:if="${param.error}" th:text="#{auth.login.error}">Неверный email или пароль</p>
<p th:if="${param.logout}" th:text="#{auth.logout.success}">Вы вышли из аккаунта</p>

<form th:action="@{/login}" method="post">
    <label for="email" th:text="#{form.email}">Email</label>
    <input id="email" type="email" name="email">

    <label for="password" th:text="#{form.password}">Пароль</label>
    <input id="password" type="password" name="password">

    <button type="submit" th:text="#{nav.login}">Войти</button>
</form>
</body>
</html>
